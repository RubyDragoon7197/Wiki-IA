<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.png" type="image/png">
    <title>Restablecer Contraseña - Wiki IA</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <a href="../index.html" class="logo">Wiki IA</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="reset-password-card">
                <h2>🔐 Nueva Contraseña</h2>
                <p>Ingresa tu nueva contraseña</p>
                
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="newPassword">Nueva contraseña</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                            <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirmar contraseña</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-error" id="resetError"></div>
                    <div class="form-success" id="resetSuccess"></div>
                    <button type="submit" class="btn btn-primary btn-full" id="resetBtn">
                        Cambiar Contraseña
                    </button>
                </form>
                
                <div class="reset-footer">
                    <a href="../index.html">← Volver al inicio</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Definir API_URL
        const API_URL = window.location.hostname.includes('github.dev') 
            ? window.location.origin.replace('-5500', '-3000') + '/api'
            : 'http://localhost:3000/api';

        // Función para mostrar/ocultar contraseña
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const eyeOpen = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>`;
            const eyeClosed = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>`;
            
            if (input.type === 'password') {
                input.type = 'text';
                button.innerHTML = eyeClosed;
            } else {
                input.type = 'password';
                button.innerHTML = eyeOpen;
            }
        }

        const form = document.getElementById('resetPasswordForm');
        const errorDiv = document.getElementById('resetError');
        const successDiv = document.getElementById('resetSuccess');
        const btn = document.getElementById('resetBtn');

        // Obtener token de la URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            errorDiv.textContent = 'Enlace inválido. Solicita uno nuevo.';
            errorDiv.classList.add('active');
            form.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            errorDiv.classList.remove('active');
            successDiv.classList.remove('active');

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Las contraseñas no coinciden';
                errorDiv.classList.add('active');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Cambiando...';

            try {
                const response = await fetch(`${API_URL}/password/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                successDiv.textContent = '¡Contraseña cambiada! Redirigiendo...';
                successDiv.classList.add('active');
                form.style.display = 'none';

                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 2000);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.add('active');
                btn.disabled = false;
                btn.textContent = 'Cambiar Contraseña';
            }
        });
    </script>
</body>
</html>
